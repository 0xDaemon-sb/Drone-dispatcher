services:
  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      BATTERY_AUDIT_INTERVAL_MS: ${BATTERY_AUDIT_INTERVAL_MS:-60000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-blusalt}:${POSTGRES_PASSWORD:-blusalt}@database:5432/${POSTGRES_DB:-blusalt}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    init: true
    command:
      - sh
      - -c
      - node dist/database/migrate.js && node dist/database/seed.js && exec node dist/server.js

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blusalt}
      POSTGRES_USER: ${POSTGRES_USER:-blusalt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blusalt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
